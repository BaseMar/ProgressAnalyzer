name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: progress_analyzer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/progress_analyzer_test
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Lint Python and sort imports
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Run unit, Streamlit and PostgreSQL tests
        run: python -m pytest --junitxml=test-results.xml
      - name: Compile application modules
        run: python -m compileall -q db metrics models services ui scripts streamlit_app.py data_loader.py data_manager.py mapper.py

  compose:
    name: Docker Compose acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Docker and Compose
        run: |
          docker version
          docker compose version
      - name: Build, render all pages and verify persistent data after recreation
        run: |
          printf 'DATABASE_URL=postgresql://unused:unused@invalid.example/unused\n' > .env
          printf 'acceptance_marker = "must stay outside the image"\n' > .streamlit/secrets.toml
          python scripts/check_compose.py
