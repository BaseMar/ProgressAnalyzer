[tool.ruff]
required-version = "==0.17.4"
target-version = "py311"
line-length = 100
include = ["*.py"]
src = [".", "tests"]
extend-exclude = [".cache", "backups", "user_settings"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The executable runner sets the repository import path before application imports.
"scripts/benchmark_project.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
    "data_loader", "data_manager", "db", "mapper", "metrics", "models", "scripts", "services", "ui",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
